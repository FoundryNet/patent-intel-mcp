name: "@foundrynet/patent-intel-mcp"
displayName: "FoundryNet Patent Intelligence"
description: >-
  USPTO patent search with semantic prior art discovery, company portfolio analysis, filing velocity tracking, and CPC technology trends.
icon: "📜"
homepage: "https://foundrynet.io"
repository: "https://github.com/FoundryNet/patent-intel-mcp"
license: "MIT"
categories:
  - data
  - research
  - legal
tags:
  - patent-search
  - uspto
  - intellectual-property
  - prior-art
  - technology-trends
  - cpc
keywords:
  - patent-search
  - uspto
  - intellectual-property
  - prior-art
  - technology-trends
  - cpc
attestation:
  protocol: "MINT Protocol"
  verified_outputs: true
  live_feed: "https://mint.foundrynet.io/feed"
network:
  name: "FoundryNet Data Network"
  servers: 17
startCommand:
  type: http
  url: "https://patent-intel-mcp-production.up.railway.app/mcp"
  transport: streamable-http
  configSchema:
    type: object
    properties:
      api_key:
        type: string
        title: "Forge billing key (optional)"
        description: "fnet_ key to bypass the per-query x402 paywall and bill to a Forge account."
